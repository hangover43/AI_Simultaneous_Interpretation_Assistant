<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI 同声传译助手</title>
    <link rel="stylesheet" href="./panel.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <h1>AI 同声传译助手</h1>
        <p id="connectionStatus">未连接</p>
        <p id="aiProviderStatus">AI: 未检测</p>
      </header>

      <section class="controls">
        <label for="topicInput">Topic</label>
        <input id="topicInput" type="text" value="AI 技术分享" autocomplete="off">
        <div class="button-row">
          <button id="startButton" type="button">开始</button>
          <button id="stopButton" type="button" disabled>停止</button>
          <button id="clearButton" type="button">清空</button>
        </div>
      </section>

      <section class="history-section">
        <h2>历史翻译</h2>
        <div id="historyList" class="history-list"></div>
      </section>
    </main>
    <script src="./panel.js"></script>
  </body>
</html>
